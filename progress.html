<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>体重の記録 | TAZパーソナルダイエット</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#202533;--muted:#687084;--line:#e1e5ef;--primary:#3557d4;--good:#16825d;--danger:#a63232}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
.wrap{width:min(720px,calc(100% - 32px));margin:0 auto;padding:28px 0 48px}
.brand{font-size:13px;font-weight:800;color:var(--primary);letter-spacing:.03em;margin-bottom:10px}
h1{font-size:27px;line-height:1.35;margin:0 0 8px}
.lead{color:var(--muted);line-height:1.7;margin:0 0 22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:16px;box-shadow:0 8px 26px rgba(40,54,96,.06)}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.metric{background:#f7f8fc;border-radius:13px;padding:14px 10px;text-align:center}
.metric span{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
.metric strong{font-size:21px}
.metric.good strong{color:var(--good)}
h2{font-size:18px;margin:0 0 16px}
form{display:flex;gap:10px}
input{min-width:0;flex:1;border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;font:inherit;font-size:17px}
input:focus{outline:3px solid rgba(53,87,212,.14);border-color:var(--primary)}
button{border:0;border-radius:12px;padding:13px 18px;background:var(--primary);color:#fff;font:inherit;font-weight:800;cursor:pointer}
button:disabled{opacity:.55;cursor:wait}
.button-secondary{background:#eef1fb;color:var(--primary)}
.button-danger{background:#fff0f0;color:var(--danger)}
.notice{border-left:4px solid var(--primary);background:#f0f3ff;padding:14px 16px;border-radius:10px;line-height:1.7;margin-bottom:16px}
.notice.good{border-color:var(--good);background:#eefaf5}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions button{flex:1}
.feedback{min-height:1.5em;margin:10px 0 0;font-size:13px;color:var(--muted)}
.feedback.error{color:var(--danger)}
.feedback.success{color:var(--good)}
.chart{height:220px;margin:4px 0 18px;position:relative}
.chart svg{display:block;width:100%;height:100%;overflow:visible}
.chart-empty{height:100%;display:grid;place-items:center;color:var(--muted);font-size:14px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:12px 8px;border-bottom:1px solid var(--line)}
th{font-size:12px;color:var(--muted)}
td:last-child,th:last-child{text-align:right}
.loading,.fatal{padding:40px 20px;text-align:center;color:var(--muted)}
.fatal{color:var(--danger)}
.back{display:inline-block;color:var(--primary);font-weight:700;text-decoration:none;margin-top:8px}
@media(max-width:520px){.wrap{width:min(100% - 22px,720px);padding-top:20px}.card{padding:17px}.summary{grid-template-columns:repeat(2,1fr);gap:6px}.metric{padding:12px 5px}.metric strong{font-size:17px}form{flex-direction:column}button{width:100%}}
</style>
</head>
<body>
<main class="wrap">
  <div class="brand">TAZ PERSONAL DIET</div>
  <h1>体重の記録</h1>
  <p class="lead">日々の体重を記録して、これまでの変化を確認できます。</p>
  <div id="app"><div class="card loading">記録を読み込んでいます…</div></div>
  <a class="back" href="/">診断ページへ戻る</a>
</main>
<script>
(function(){
  const app=document.getElementById('app');
  const params=new URLSearchParams(location.hash.slice(1));
  const token=params.get('token')||'';
  const shouldStart=params.get('start')==='1';
  const checkin=params.get('checkin')||'';
  const esc=value=>String(value).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  const kg=value=>Number(value).toFixed(1)+' kg';
  const date=value=>new Intl.DateTimeFormat('ja-JP',{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(value));
  let entries=[];
  let profile=null;
  let startMessage='';

  async function api(body){
    const response=await fetch('/api/progress',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...body,token})});
    const result=await response.json().catch(()=>({}));
    if(!response.ok)throw new Error(result.message||'通信に失敗しました。');
    return result;
  }

  function chartMarkup(items){
    if(items.length<2)return '<div class="chart-empty">2回目の記録からグラフが表示されます</div>';
    const width=640,height=200,padX=28,padY=22;
    const values=items.map(item=>Number(item.weight));
    let min=Math.min(...values),max=Math.max(...values);
    const range=Math.max(max-min,1);
    min-=range*.2;max+=range*.2;
    const points=values.map((value,index)=>{
      const x=padX+(width-padX*2)*(index/(values.length-1));
      const y=padY+(height-padY*2)*(1-(value-min)/(max-min));
      return {x,y,value};
    });
    const polyline=points.map(point=>point.x+','+point.y).join(' ');
    const circles=points.map(point=>'<circle cx="'+point.x+'" cy="'+point.y+'" r="5" fill="#3557d4"><title>'+point.value.toFixed(1)+' kg</title></circle>').join('');
    return '<svg viewBox="0 0 '+width+' '+height+'" role="img" aria-label="体重変化グラフ"><line x1="'+padX+'" y1="'+(height-padY)+'" x2="'+(width-padX)+'" y2="'+(height-padY)+'" stroke="#e1e5ef"/><polyline points="'+polyline+'" fill="none" stroke="#3557d4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>'+circles+'</svg>';
  }

  function render(){
    const first=Number(entries[0].weight);
    const latest=Number(entries[entries.length-1].weight);
    const target=Number(profile.target_weight);
    const change=latest-first;
    const changeText=(change>0?'+':'')+change.toFixed(1)+' kg';
    const checkinLabels={week1:'開始後の継続確認',month1:'1か月目',month2:'2か月目',month3:'3か月目'};
    const checkinLabel=checkinLabels[checkin]||(checkin.startsWith('continue_')?'継続チェック':'');
    const isEnded=profile.program_status==='ended';
    const canContinue=profile.latest_checkin==='month3'||checkin==='month3';
    const rows=[...entries].reverse().map((item,index)=>{
      const previousIndex=entries.length-2-index;
      const delta=previousIndex>=0?Number(item.weight)-Number(entries[previousIndex].weight):null;
      const deltaText=delta===null?'開始':(delta>0?'+':'')+delta.toFixed(1)+' kg';
      return '<tr><td>'+esc(date(item.recorded_at))+'</td><td>'+esc(deltaText)+'</td><td><strong>'+esc(kg(item.weight))+'</strong></td></tr>';
    }).join('');
    app.innerHTML=
      (startMessage?'<div class="notice good">'+esc(startMessage)+'</div>':'')+
      (checkinLabel?'<div class="notice"><strong>'+esc(checkinLabel)+'の入力です。</strong><br>現在の体重を入力して、これまでの変化を確認しましょう。</div>':'')+
      '<section class="card summary">'+
        '<div class="metric"><span>開始時</span><strong>'+esc(kg(first))+'</strong></div>'+
        '<div class="metric"><span>目標</span><strong>'+esc(kg(target))+'</strong></div>'+
        '<div class="metric"><span>最新</span><strong>'+esc(kg(latest))+'</strong></div>'+
        '<div class="metric '+(change<=0?'good':'')+'"><span>開始時から</span><strong>'+esc(changeText)+'</strong></div>'+
      '</section>'+
      (isEnded
        ? '<section class="card"><div class="notice">このプログラムは終了しています。予約メールも停止されています。</div></section>'
        : '<section class="card"><h2>'+(checkinLabel?esc(checkinLabel)+'の体重を入力':'今日の体重を追加')+'</h2><form id="weightForm"><input id="weight" type="number" inputmode="decimal" step="0.1" min="0.1" max="999.9" placeholder="例：65.4" aria-label="体重（kg）" required><button id="submit" type="submit">記録する</button></form><p id="feedback" class="feedback">単位：kg</p></section>')+
      '<section class="card"><h2>体重の変化</h2><div class="chart">'+chartMarkup(entries)+'</div><table><thead><tr><th>記録日時</th><th>前回比</th><th>体重</th></tr></thead><tbody>'+rows+'</tbody></table></section>'+
      (!isEnded&&canContinue?'<section class="card" id="continuation"><h2>3か月後の継続</h2><p class="lead">継続する場合のみ登録してください。目標達成済みの場合は体重メンテナンス、未達成の場合は減量プログラムを継続します。</p><div class="actions"><button id="continueProgram" type="button">プログラムを継続する</button></div><p id="continueFeedback" class="feedback"></p></section>':'')+
      (!isEnded?'<section class="card"><h2>プログラムの終了</h2><p class="lead">いつでも終了できます。終了すると、まだ送られていない予約メールを停止します。</p><button id="stopProgram" class="button-danger" type="button">プログラムを解約する</button><p id="stopFeedback" class="feedback"></p></section>':'');
    const form=document.getElementById('weightForm');
    if(form)form.addEventListener('submit',addWeight);
    const continueButton=document.getElementById('continueProgram');
    if(continueButton)continueButton.addEventListener('click',continueProgram);
    const stopButton=document.getElementById('stopProgram');
    if(stopButton)stopButton.addEventListener('click',stopProgram);
  }

  async function addWeight(event){
    event.preventDefault();
    const input=document.getElementById('weight');
    const button=document.getElementById('submit');
    const feedback=document.getElementById('feedback');
    const weight=Number(input.value);
    button.disabled=true;
    feedback.className='feedback';
    feedback.textContent='保存しています…';
    try{
      const result=await api({action:'add',weight,checkin});
      entries.push(result.entry);
      profile.current_weight=result.entry.weight;
      if(checkin)profile.latest_checkin=checkin;
      render();
      const nextFeedback=document.getElementById('feedback');
      if(nextFeedback){
        nextFeedback.className='feedback success';
        nextFeedback.textContent=result.emailSent?'体重を記録しました。到達度に応じたコメントをメールで送りました。':'体重を記録しました。';
      }
    }catch(error){
      feedback.className='feedback error';
      feedback.textContent=error.message;
      button.disabled=false;
    }
  }

  async function continueProgram(){
    const button=document.getElementById('continueProgram');
    const feedback=document.getElementById('continueFeedback');
    button.disabled=true;
    feedback.textContent='登録しています…';
    try{
      const result=await api({action:'continue'});
      profile.program_status='continuing';
      feedback.className='feedback success';
      feedback.textContent=result.message;
      button.remove();
    }catch(error){
      feedback.className='feedback error';
      feedback.textContent=error.message;
      button.disabled=false;
    }
  }

  async function stopProgram(){
    if(!confirm('プログラムを終了し、今後の予約メールを停止しますか？'))return;
    const button=document.getElementById('stopProgram');
    const feedback=document.getElementById('stopFeedback');
    button.disabled=true;
    feedback.textContent='停止しています…';
    try{
      const result=await api({action:'stop'});
      profile.program_status='ended';
      startMessage=result.message;
      render();
    }catch(error){
      feedback.className='feedback error';
      feedback.textContent=error.message;
      button.disabled=false;
    }
  }

  async function start(){
    if(!/^[A-Za-z0-9_-]{40,128}$/.test(token)){
      app.innerHTML='<div class="card fatal">専用リンクが無効です。登録完了メール内のリンクから開いてください。</div>';
      return;
    }
    try{
      if(shouldStart){
        const started=await api({action:'start'});
        startMessage=started.message;
      }
      const result=await api({action:'list'});
      entries=result.entries;
      profile=result.profile;
      render();
    }catch(error){
      app.innerHTML='<div class="card fatal">'+esc(error.message)+'</div>';
    }
  }
  start();
})();
</script>
</body>
</html>
